# Known vulnerabilities reviewed and addressed some other way than upgrading. Each entry
# expires, so it's looked at again.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-05
reason = """braces 3.0.3 (no fixed release yet) is reached only through micromatch in \
fast-glob, which development tools use (type-coverage, ts-morph and the shadcn CLI) to \
expand the repository's own glob patterns; no service passes it input from a request. \
Upgrade when a release fixes it."""

[[IgnoredVulns]]
id = "GHSA-p6vx-979v-rg4c"
ignoreUntil = 2026-11-05
reason = """seroval 1.5.6 is pinned (~1.5.4) by solid-js 1.9.15, the newest, which only the \
React Query devtools use: a development dependency of the web app that renders nothing in \
a production build, and it serializes only the page's own query cache. Upgrade when \
solid-js allows seroval 1.6.2 or later."""

