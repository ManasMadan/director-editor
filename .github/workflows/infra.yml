# Infrastructure changes (infra/tofu). Pull requests get a `tofu plan` for every
# environment listed in the TOFU_TARGETS repository variable, posted on the pull
# request. Applying is manual (Run workflow → environment, apply) and waits for the
# GitHub environment's required reviewers. Every night, master's code is planned against
# each environment too: a plan with changes means the infrastructure drifted from git
# (something changed by hand, or outside OpenTofu), and opens the issue
# "Infrastructure drift: <env>" with the plan's summary, closed once a plan is clean.
#
# A pull request's plan runs the pull request's own OpenTofu code, so it runs in an
# environment of its own, infra-<env>-plan, that holds only what a plan needs: no SSH
# key and no age keys (only an apply uses them), read-only Cloudflare and state
# credentials. It still decrypts the state, which holds the cluster's admin key, so
# that environment requires a reviewer too: read the pull request's infra/tofu changes
# before approving its plan. Pull requests from forks get no plan.
#
# The runner needs to reach the nodes: SSH (22) to install k3s, and the Kubernetes API
# (6443) for Argo CD's bootstrap and every plan. Allow GitHub's runner addresses there,
# or run this on a self-hosted runner that's inside your network.
#
# Setup (GitHub → Settings → Environments; docs/repository-settings.md has the commands):
#   TOFU_TARGETS (repository variable)  e.g. ["staging", "production"]
#   in infra-<env> (apply, master only) and infra-<env>-plan (plans, any branch):
#     TOFU_BACKEND (secret)             the contents of backend-<env>.hcl; read-only
#                                       bucket keys in the plan environment
#     TOFU_TFVARS (secret)              the contents of <env>.tfvars
#     CLOUDFLARE_API_TOKEN (secret)     see infra/tofu/modules/cloudflare; its read
#                                       permissions only in the plan environment
#     TF_VAR_state_passphrase (secret)  encrypts state and plans
#   in infra-<env>-drift (the nightly plan, master only, no reviewers): the plan
#     environment's four secrets, with the same read-only credentials
#   in infra-<env> only:
#     SSH_PRIVATE_KEY (secret)          the key the nodes accept
#     SOPS_AGE_KEY (secret)             the environment's age private key
#     SOPS_PREVIEW_AGE_KEY (secret)     where previews run: their own age private key
name: Infrastructure

on:
  pull_request:
  merge_group:
  # Nightly: the drift check.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [staging, production]
      apply:
        description: Apply the plan (otherwise only plan)
        type: boolean
        default: false

concurrency:
  group: infra-${{ github.event.pull_request.number || inputs.env }}
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      # A pull request or merge group plans only when it changes infra/tofu; anything else (nightly, by hand) always runs.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PATTERN: '^infra/tofu/'
        run: |
          if [[ -z "$BASE" ]] || git diff --name-only "$BASE...HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  targets:
    name: Environments
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - id: targets
        env:
          TARGETS: ${{ vars.TOFU_TARGETS }}
          EVENT: ${{ github.event_name }}
          ENV: ${{ inputs.env }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "matrix=[\"$ENV\"]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=${TARGETS:-[]}" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: plan ${{ matrix.env }}
    needs: targets
    if: >-
      github.event_name == 'pull_request' && needs.targets.outputs.matrix != '[]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra-${{ matrix.env }}-plan
    permissions: { contents: read, pull-requests: write }
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        working-directory: infra/tofu/envs/k3s
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: 1.11.10, tofu_wrapper: false }
      - name: Environment files
        env:
          BACKEND: ${{ secrets.TOFU_BACKEND }}
          TFVARS: ${{ secrets.TOFU_TFVARS }}
        run: |
          umask 077
          printf '%s\n' "$BACKEND" > backend.hcl
          printf '%s\n' "$TFVARS" > env.tfvars
      - run: tofu init -input=false -backend-config=backend.hcl
      # Without the state lock: the plan environment's bucket keys are read-only, and a
      # plan changes nothing.
      - name: Plan
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -lock=false -var-file=env.tfvars | tee plan.txt
      - name: Post the plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET: ${{ matrix.env }}
        with:
          script: |
            const fs = require("node:fs");
            const plan = fs.readFileSync("infra/tofu/envs/k3s/plan.txt", "utf8");
            const summary = plan.split("\n").filter((line) => /^(Plan:|No changes\.)/.test(line)).join("\n");
            const marker = `<!-- tofu-plan ${process.env.TARGET} -->`;
            const body = `${marker}\n**OpenTofu plan: ${process.env.TARGET}**\n\n${summary || "(see the run's log)"}\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            const number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }

  # The nightly drift check: master's code planned against each environment, in an
  # environment of its own (read-only credentials like the plan's, but master only and
  # without reviewers, so nothing waits for an approval at night).
  drift:
    name: drift ${{ matrix.env }}
    needs: targets
    if: github.event_name == 'schedule' && needs.targets.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra-${{ matrix.env }}-drift
    permissions: { contents: read, issues: write }
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        working-directory: infra/tofu/envs/k3s
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: 1.11.6, tofu_wrapper: false }
      - name: Environment files
        env:
          BACKEND: ${{ secrets.TOFU_BACKEND }}
          TFVARS: ${{ secrets.TOFU_TFVARS }}
        run: |
          umask 077
          printf '%s\n' "$BACKEND" > backend.hcl
          printf '%s\n' "$TFVARS" > env.tfvars
      - run: tofu init -input=false -backend-config=backend.hcl
      # -detailed-exitcode: 0 is no changes, 2 is changes (drift), 1 is an error. Only the
      # summary line goes in the issue; the plan itself stays in the run's log.
      - name: Plan
        id: plan
        run: |
          set +e -o pipefail
          tofu plan -input=false -no-color -lock=false -detailed-exitcode -var-file=env.tfvars | tee plan.txt
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "summary=$(grep -m1 -E '^Plan:' plan.txt)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/issue
        if: steps.plan.outputs.status == '0' || steps.plan.outputs.status == '2'
        with:
          title: "Infrastructure drift: ${{ matrix.env }}"
          body: >-
            ${{ steps.plan.outputs.status == '2' && format('{0} differs from infra/tofu on master: {1} Plan it (Run workflow) to see the changes, then apply master or change the code to match.', matrix.env, steps.plan.outputs.summary) || '' }}
      - name: Fail on drift or a failed plan
        if: steps.plan.outputs.status != '0'
        run: exit 1

  apply:
    name: ${{ matrix.env }}
    needs: targets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: infra-${{ matrix.env }}
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        working-directory: infra/tofu/envs/k3s
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      TF_VAR_sops_age_key: ${{ secrets.SOPS_AGE_KEY }}
      TF_VAR_sops_preview_age_key: ${{ secrets.SOPS_PREVIEW_AGE_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: 1.11.10, tofu_wrapper: false }
      - name: Environment files
        env:
          BACKEND: ${{ secrets.TOFU_BACKEND }}
          TFVARS: ${{ secrets.TOFU_TFVARS }}
        run: |
          umask 077
          printf '%s\n' "$BACKEND" > backend.hcl
          printf '%s\n' "$TFVARS" > env.tfvars
      - run: tofu init -input=false -backend-config=backend.hcl
      - name: Plan
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -var-file=env.tfvars -out=tfplan | tee plan.txt
      - name: Apply
        if: inputs.apply
        run: tofu apply -input=false tfplan

  # The one check the master ruleset requires from this workflow (docs/repository-settings.md):
  # it always reports, so a pull request this workflow has nothing to do for isn't left
  # waiting on it.
  infra-ok:
    name: Infrastructure passed
    if: always()
    needs: [changes, targets, plan, drift, apply]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            nodejs.org:443
            registry.npmjs.org:443
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        # Each job succeeded, or had nothing to do (no infra/tofu change, no targets, not an apply, not the night).
        run: echo "$NEEDS" | jq -e '.changes.result == "success" and (del(.changes) | to_entries | all(.value.result == "success" or .value.result == "skipped"))' > /dev/null
