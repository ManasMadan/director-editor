# Dependency updates: Renovate, self-hosted here rather than the hosted app, because the
# catalog in the root package.json needs `bun install` after each update to keep bun.lock
# in step, and only a self-hosted Renovate may run commands (renovate.json5 has the rest).
# It opens its pull requests as the repository's GitHub App, so they start CI; the App
# also needs Issues (the dependency dashboard) and Workflows (to update the actions
# pinned in .github) write permissions. See docs/repository-settings.md.
name: Renovate

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    if: vars.BOT_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
      - uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ steps.app.outputs.token }}
          renovate-version: 44.119.1
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits made through the API as the App are signed (verified) by GitHub.
          RENOVATE_PLATFORM_COMMIT: enabled
          # Exactly the commands renovate.json5's postUpgradeTasks run (scripts/playwright.test.ts).
          RENOVATE_ALLOWED_COMMANDS: '["^bun install$", "^rm -rf \\.claude/skills/playwright-\\*$", "^PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \\.claude/bin/playwright-cli install --skills$", "^bunx playwright trace install-skill$"]'
          RENOVATE_BINARY_SOURCE: install
