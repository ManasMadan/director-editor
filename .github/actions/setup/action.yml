# Shared toolchain setup for every CI job: the same Node, Bun and (optionally) uv
# versions developers use, dependencies installed from the lockfile, and Turborepo's
# local cache restored so unchanged packages are skipped.
name: Setup
description: Install Node, Bun, dependencies and restore the Turborepo cache
inputs:
  python:
    description: Also install uv and the Python service's dependencies
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      if: inputs.python == 'true'
      with:
        # The devcontainer's uv (.devcontainer/Dockerfile); Renovate moves both together.
        version: 0.12.17
        enable-cache: true
        cache-dependency-glob: apps/ai/uv.lock
        # A key per job: with one shared key, the jobs that finish together race to save
        # it ("Unable to reserve cache") and most of them save nothing.
        cache-suffix: ${{ github.job }}
    # Bun's download cache, so an install only fetches what the lockfile changed.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Install Python dependencies
      if: inputs.python == 'true'
      shell: bash
      working-directory: apps/ai
      run: uv sync --locked
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
