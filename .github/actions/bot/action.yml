# A token for the workflows that write to the repository (the staging bump, Renovate),
# from the repository's GitHub App. Unlike the
# default GITHUB_TOKEN, what it pushes and the pull requests it opens start CI, and the
# App can be allowed to push the staging bump past branch protection. Setup:
# docs/repository-settings.md. Without the App it falls back to GITHUB_TOKEN and says
# what that breaks.
name: Bot token
description: A GitHub App token for writing to the repository, and the git identity to match
inputs:
  client-id:
    description: The App's client ID (vars.BOT_APP_CLIENT_ID)
  private-key:
    description: The App's private key (secrets.BOT_APP_PRIVATE_KEY)
  fallback-token:
    description: Used when the App isn't set up (secrets.GITHUB_TOKEN)
    required: true
outputs:
  token:
    description: The token to check out, push and open pull requests with
    value: ${{ steps.app.outputs.token || inputs.fallback-token }}
runs:
  using: composite
  steps:
    - id: app
      if: inputs.client-id != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
    - name: Git identity
      shell: bash
      env:
        SLUG: ${{ steps.app.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        if [[ -z "$SLUG" ]]; then
          echo "::warning::No GitHub App configured (BOT_APP_CLIENT_ID): pull requests opened with GITHUB_TOKEN don't start CI, and pushes to a protected master are refused. See docs/repository-settings.md."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          exit 0
        fi
        id=$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)
        git config --global user.name "$SLUG[bot]"
        git config --global user.email "$id+$SLUG[bot]@users.noreply.github.com"
