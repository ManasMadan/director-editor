name: Bug
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: "1. bun dev\n2. Open …\n3. …"
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Where
      description: The app or package (web, api, mobile, …) and the commit or release.
  - type: textarea
    id: logs
    attributes:
      label: Logs or `bun run doctor` output
      render: text
