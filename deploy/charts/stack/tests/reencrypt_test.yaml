suite: re-encryption
templates: [reencrypt-cronjob.yaml]
release: { name: demo, namespace: apps }
set:
  image.tag: sha-abc123
  site.host: app.example.com
tests:
  - it: never runs on its own, only when a job is created from it
    asserts:
      - isKind: { of: CronJob }
      - equal: { path: metadata.name, value: demo-reencrypt }
      - equal: { path: spec.suspend, value: true }
      - equal: { path: spec.concurrencyPolicy, value: Forbid }
      - equal: { path: spec.jobTemplate.spec.backoffLimit, value: 0 }
      - equal: { path: spec.jobTemplate.spec.template.spec.restartPolicy, value: Never }

  - it: runs the api's image with the api's environment, in a pod of its own
    asserts:
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].image", value: ghcr.io/manasmadan/boilerplate/api:sha-abc123 }
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].command", value: [/nodejs/bin/node, dist/reencrypt.mjs] }
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content:
            name: API_DATABASE_URL
            value: "$(DATABASE_SECRET_URL)?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt"
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].volumeMounts"
          content: { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content:
            name: REDIS_URL
            valueFrom: { secretKeyRef: { name: valkey, key: url } }
      - equal:
          path: "spec.jobTemplate.spec.template.spec.containers[0].envFrom"
          value: [{ secretRef: { name: demo-api } }]
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory", value: 512Mi }

  - it: is locked down like the services
    asserts:
      - equal: { path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken, value: false }
      - equal: { path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true }
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop", value: [ALL] }

  - it: can be turned off
    set:
      reencrypt.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: isn't there when the api isn't deployed
    set:
      services.api.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
