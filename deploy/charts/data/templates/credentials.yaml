{{- /*
The data services' credentials, generated in the cluster: one Secret per database role
(username, password, url, directUrl), Valkey's (host, port, password, url) and the
object storage keys. A Job creates each Secret with random values unless it already
exists, before anything else of the release is applied, so a password is made once and
never changes under a running database. Nothing else can create them and the Job can't
read them back: its role may only create Secrets.

CloudNativePG reads the role Secrets to set each role's password; the stack's services
read `url` (and the worker `directUrl`).

In the templates, @password@ becomes 48 random hex characters and @key@ 20, fresh for
each Secret: hex, because the values go into connection URLs unescaped.
*/}}
{{- $name := printf "%s-credentials" (include "data.name" .) }}
{{- $secrets := list }}
{{- range $role := .Values.database.roles }}
{{- $url := printf "postgresql://%s:@password@@%s:5432/%s" $role (include "data.postgresHost" $) $.Values.database.name }}
{{- $secrets = append $secrets (dict
    "metadata" (dict "name" (include "data.roleSecret" (list $ $role)) "labels" (dict "cnpg.io/reload" "true"))
    "type" "kubernetes.io/basic-auth"
    "stringData" (dict "username" $role "password" "@password@" "url" $url "directUrl" $url)) }}
{{- end }}
{{- $valkeyHost := include "data.valkeyHost" . }}
{{- $secrets = append $secrets (dict
    "metadata" (dict "name" .Values.valkey.secretName)
    "stringData" (dict "host" $valkeyHost "port" "6379" "password" "@password@" "url" (printf "redis://:@password@@%s:6379" $valkeyHost))) }}
{{- $uploads := .Values.storage.uploads }}
{{- if $uploads.enabled }}
{{- $host := required "storage.uploads.host is required (the public host of the uploads bucket)" $uploads.host }}
{{- $secrets = append $secrets (dict
    "metadata" (dict "name" $uploads.secretName)
    "stringData" (dict
      "bucket" $uploads.bucket
      "region" .Values.storage.region
      "endpoint" (include "data.rustfsEndpoint" (list . "uploads"))
      "publicEndpoint" (printf "%s://%s" $uploads.scheme $host)
      "accessKeyId" "@key@"
      "secretAccessKey" "@password@")) }}
{{- end }}
{{- if .Values.postgres.backups.enabled }}
{{- $secrets = append $secrets (dict
    "metadata" (dict "name" (include "data.backupsSecret" .))
    "stringData" (dict "accessKeyId" "@key@" "secretAccessKey" "@password@")) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    {{- include "data.preHook" (list . "-20") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    {{- include "data.preHook" (list . "-20") | nindent 4 }}
rules:
  # Create only: it can't read, change or delete a Secret, so a rerun can't touch one.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    {{- include "data.preHook" (list . "-20") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    {{- include "data.preHook" (list . "-10") | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credentials
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        {{- include "data.podSecurity" $ | nindent 8 }}
      containers:
        - name: credentials
          image: {{ .Values.credentials.image }}
          command: [sh, -c]
          args:
            - |
              set -eu
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              api="https://kubernetes.default.svc/api/v1/namespaces/$(cat "$sa/namespace")/secrets"
              random() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              create() {
                body=$(printf '%s' "$2" | sed -e "s/@password@/$(random 24)/g" -e "s/@key@/$(random 10)/g")
                status=$(printf '%s' "$body" | curl -sS -o /tmp/response -w '%{http_code}' \
                  --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" \
                  -H 'Content-Type: application/json' --data-binary @- "$api")
                case "$status" in
                  201) echo "created $1" ;;
                  409) echo "kept $1" ;;
                  *) echo "creating $1 failed (HTTP $status):" >&2; cat /tmp/response >&2; exit 1 ;;
                esac
              }
              {{- range $secret := $secrets }}
              create {{ $secret.metadata.name }} {{ merge (dict "apiVersion" "v1" "kind" "Secret") $secret | toJson | squote }}
              {{- end }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            {{- include "data.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
