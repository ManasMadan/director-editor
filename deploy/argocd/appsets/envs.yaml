# Staging and production: the data and stack releases on each cluster labelled
# boilerplate.dev/environment=staging|production, with that environment's values
# (deploy/environments/<env>/). Data syncs first, so the stack's migration finds the
# database up. The stack also gets the environment's Secrets, decrypted from
# deploy/environments/<env>/secrets/ by Argo CD's sops plugin, and exports telemetry to
# the cluster's Jaeger and Prometheus when it has the boilerplate.dev/observability
# label. Staging follows master, and CI commits its image tag on every merge.
# Production runs a release: its charts, values and Secrets are read at the tag in
# deploy/environments/production/release.yaml, with that release's images, and only a
# promotion pull request changes that file. So merging a chart change deploys it to
# staging, not to production.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envs
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchExpressions:
                        - key: boilerplate.dev/environment
                          operator: In
                          values: [staging, production]
                # The revision the environment deploys from, and production's images:
                # deploy/environments/<env>/release.yaml, read at HEAD.
                - git:
                    repoURL: https://github.com/ManasMadan/boilerplate.git
                    revision: HEAD
                    pathParamPrefix: release
                    files:
                      - path: 'deploy/environments/{{ index .metadata.labels "boilerplate.dev/environment" }}/release.yaml'
          - list:
              elements:
                - chart: data
                - chart: stack
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: chart
              operator: In
              values: [data]
        - matchExpressions:
            - key: chart
              operator: In
              values: [stack]
  template:
    metadata:
      name: '{{ index .metadata.labels "boilerplate.dev/environment" }}-{{ .chart }}'
      labels:
        chart: "{{ .chart }}"
        environment: '{{ index .metadata.labels "boilerplate.dev/environment" }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      destination:
        server: "{{ .server }}"
        namespace: boilerplate
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
  templatePatch: |
    {{- $env := index .metadata.labels "boilerplate.dev/environment" }}
    spec:
      sources:
        - repoURL: https://github.com/ManasMadan/boilerplate.git
          targetRevision: "{{ .revision }}"
          path: deploy/charts/{{ .chart }}
          helm:
            releaseName: boilerplate
            valueFiles:
              - ../../environments/{{ $env }}/{{ .chart }}.yaml
            {{- if eq .chart "stack" }}
            parameters:
              - name: observability.enabled
                value: {{ eq (index .metadata.labels "boilerplate.dev/observability" | default "") "true" | quote }}
              {{- if hasKey . "imageTag" }}
              - name: image.tag
                value: {{ .imageTag | quote }}
              {{- end }}
            {{- end }}
        {{- if eq .chart "stack" }}
        - repoURL: https://github.com/ManasMadan/boilerplate.git
          targetRevision: "{{ .revision }}"
          path: deploy/environments/{{ $env }}/secrets
          plugin:
            name: sops
        {{- end }}
