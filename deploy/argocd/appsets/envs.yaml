# Staging and production: the data and stack releases on each cluster labelled
# director-editor.dev/environment=staging|production, with that environment's values
# (deploy/environments/<env>/). Each syncs and heals on its own (no progressive sync,
# which turns self-heal off): on a new cluster the stack's migration fails until the
# data release's database is up, and the sync is retried until it is. The stack also
# gets the environment's Secrets, decrypted from deploy/environments/<env>/secrets/ by
# Argo CD's sops plugin, and exports telemetry to the cluster's Jaeger and Prometheus
# when it has the director-editor.dev/observability label. Staging follows master, and
# CI commits its image tag on every merge. Production runs a release: its charts,
# values and Secrets are read at the tag in deploy/environments/production/release.yaml,
# with that release's images, and only a promotion pull request changes that file. So
# merging a chart change deploys it to staging, not to production.
#
# Both sync with client-side apply. Never sync them by hand with the server-side apply
# option: fields applied that way stay when a later client-side sync drops them
# (deploy/README.md, "Troubleshooting").
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envs
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchExpressions:
                        - key: director-editor.dev/environment
                          operator: In
                          values: [staging, production]
                # The revision the environment deploys from, and production's images:
                # deploy/environments/<env>/release.yaml, read at HEAD.
                - git:
                    repoURL: https://github.com/ManasMadan/director-editor.git
                    revision: HEAD
                    pathParamPrefix: release
                    files:
                      - path: 'deploy/environments/{{ index .metadata.labels "director-editor.dev/environment" }}/release.yaml'
          - list:
              elements:
                - chart: data
                - chart: stack
  template:
    metadata:
      name: '{{ index .metadata.labels "director-editor.dev/environment" }}-{{ .chart }}'
      labels:
        chart: "{{ .chart }}"
        environment: '{{ index .metadata.labels "director-editor.dev/environment" }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      destination:
        server: "{{ .server }}"
        namespace: director-editor
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
  templatePatch: |
    {{- $env := index .metadata.labels "director-editor.dev/environment" }}
    spec:
      sources:
        - repoURL: https://github.com/ManasMadan/director-editor.git
          targetRevision: "{{ .revision }}"
          path: deploy/charts/{{ .chart }}
          helm:
            releaseName: director-editor
            valueFiles:
              - ../../environments/{{ $env }}/{{ .chart }}.yaml
            {{- if eq .chart "stack" }}
            parameters:
              - name: observability.enabled
                value: {{ eq (index .metadata.labels "director-editor.dev/observability" | default "") "true" | quote }}
              {{- if hasKey . "imageTag" }}
              - name: image.tag
                value: {{ .imageTag | quote }}
              {{- end }}
            {{- end }}
        {{- if eq .chart "stack" }}
        - repoURL: https://github.com/ManasMadan/director-editor.git
          targetRevision: "{{ .revision }}"
          path: deploy/environments/{{ $env }}/secrets
          plugin:
            name: sops
        {{- end }}
