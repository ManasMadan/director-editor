# k3s runs the control plane (etcd, scheduler, controller manager) and kube-proxy's job
# inside its own process, with nothing to scrape at the usual endpoints: scraping them
# would only raise "target down" alerts.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    # The services push their metrics over OTLP (the stack chart sets
    # OTEL_EXPORTER_OTLP_METRICS_ENDPOINT to /api/v1/otlp/v1/metrics here).
    enableOTLPReceiver: true
    # The alerts add-on's rules and pod monitors (deploy/platform/alerts), which aren't
    # labelled with this release.
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    otlp:
      promoteResourceAttributes: [service.name, service.instance.id]
    retention: 15d
    retentionSize: 18GB
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

grafana:
  # Our user, which owns the data volume through fsGroup: no root init container to
  # chown it.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  initChownData:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  sidecar:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    # Dashboards are ConfigMaps labelled grafana_dashboard: "1" in any namespace, so
    # each chart can ship its own next to what it shows.
    dashboards:
      searchNamespace: ALL
  # From deploy/platform/secrets/<environment>/grafana.sops.yaml (keys admin-user and
  # admin-password). Reached at grafana.<the cluster's zone>, behind the gateway's basic
  # auth (deploy/platform/internal-tools), and still asks for this login.
  admin:
    existingSecret: grafana-admin
  # Traces and logs next to the metrics, linked both ways: a log line's trace id opens
  # the trace in Jaeger, and a trace's spans open the logs that mention its id. The
  # services write the id as trace_id (and the activity log as traceId). `$$` is a
  # literal `$`: Grafana expands environment variables in these files.
  additionalDataSources:
    - name: Jaeger
      type: jaeger
      uid: jaeger
      url: http://jaeger.observability.svc.cluster.local:16686
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -1h
          spanEndTimeShift: 1h
          customQuery: true
          query: '{namespace=~".+"} |= "$${__trace.traceId}"'
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
        derivedFields:
          - name: traceId
            datasourceUid: jaeger
            matcherRegex: '"(?:trace_id|traceId)":"([0-9a-f]{32})"'
            url: "$${__value.raw}"
            urlDisplayLabel: Trace in Jaeger
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

alertmanager:
  alertmanagerSpec:
    # It never talks to the Kubernetes API.
    automountServiceAccountToken: false
    # The alerts add-on's receiver (an AlertmanagerConfig) takes every alert, not only
    # those from its own namespace.
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

# Every pod as an unprivileged user above the node's own ids (node-exporter's and
# kube-state-metrics' 65534 already are; the others 10001) and every container with CPU
# and memory requested and limited, as for every container here (the misconfiguration
# scan, scripts/misconfig.ts, fails without). What node-exporter needs from the node is
# a reviewed exception (.trivyignore.yaml).
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  admissionWebhooks:
    patch:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
    seccompProfile: { type: RuntimeDefault }
