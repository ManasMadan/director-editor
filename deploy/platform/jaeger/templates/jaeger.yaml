{{- /*
The services send OTLP over HTTP to http://jaeger.<namespace>:4318 (the stack chart sets
OTEL_EXPORTER_OTLP_ENDPOINT to it on clusters with observability). The UI isn't public:
  kubectl -n observability port-forward svc/jaeger 16686   →   http://localhost:16686
*/}}
{{- $labels := dict "app.kubernetes.io/name" "jaeger" "app.kubernetes.io/instance" .Release.Name }}
{{- $config := dict
  "service" (dict
    "extensions" (list "jaeger_storage" "jaeger_query")
    "pipelines" (dict "traces" (dict
      "receivers" (list "otlp")
      "processors" (list "batch")
      "exporters" (list "jaeger_storage_exporter"))))
  "extensions" (dict
    "jaeger_storage" (dict "backends" (dict "memory" (dict "memory" (dict "max_traces" .Values.maxTraces))))
    "jaeger_query" (dict "storage" (dict "traces" "memory")))
  "receivers" (dict "otlp" (dict "protocols" (dict
    "grpc" (dict "endpoint" "0.0.0.0:4317")
    "http" (dict "endpoint" "0.0.0.0:4318"))))
  "processors" (dict "batch" dict)
  "exporters" (dict "jaeger_storage_exporter" (dict "trace_storage" "memory")) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    {{- toYaml $labels | nindent 4 }}
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: ui, port: 16686, targetPort: ui }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  # One replica: traces are in its memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- toYaml $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's user.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: {{ .Values.image }}
          args: [--config, /etc/jaeger/config.yaml]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          readinessProbe:
            tcpSocket: { port: otlp-http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: ui }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/jaeger, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: jaeger
        - name: tmp
          emptyDir: {}
