# The add-ons' credentials, decrypted from deploy/platform/secrets/<environment>/ (SOPS):
# the Cloudflare token (cert-manager, external-dns), the mail server's, Grafana's admin,
# and on the cluster hosting previews the GitHub token Argo CD lists pull requests with.
# Each file names its own namespace.
addon: platform-secrets
namespace: argocd
secretsPath: deploy/platform/secrets
wave: "-30"
