apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mail.name" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}
spec:
  secretName: {{ include "mail.name" . }}-tls
  dnsNames:
    - {{ include "mail.hostname" . }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.tls.issuer }}
