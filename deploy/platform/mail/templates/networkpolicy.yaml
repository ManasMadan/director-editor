{{- /*
The mail ports take connections from anywhere (other mail servers, the services
submitting mail). Its management port (8080) is reachable only from the gateway's
proxies, for the web admin (webAdmin), behind the gateway's basic auth and the server's
own sign-in; the settings are applied from inside the pod.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mail.name" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mail.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  # The pod's own ports (the Service forwards 25 to 2525, and so on).
  ingress:
    - ports:
        {{- range $name, $l := include "mail.listeners" . | fromYaml }}
        - port: {{ $l.containerPort }}
        {{- end }}
    {{- if .Values.webAdmin.enabled }}
    # The web admin, from the gateway's proxies only (behind its basic auth).
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.webAdmin.gatewayNamespaceSelector | nindent 14 }}
      ports:
        - port: 8080
    {{- end }}
