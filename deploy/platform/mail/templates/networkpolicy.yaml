{{- /*
The mail ports take connections from anywhere (other mail servers, the services
submitting mail); nothing else on the pod does. Its management port (8080) stays out
of reach of every other pod: the settings are applied from inside the pod.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mail.name" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mail.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  # The pod's own ports (the Service forwards 25 to 2525, and so on).
  ingress:
    - ports:
        {{- range $name, $l := include "mail.listeners" . | fromYaml }}
        - port: {{ $l.containerPort }}
        {{- end }}
