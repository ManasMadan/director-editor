{{- $tls := .Values.tls }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: {{ required "tls.email is required (Let's Encrypt expiry notices)" $tls.email | quote }}
    server: {{ if $tls.staging }}https://acme-staging-v02.api.letsencrypt.org/directory{{ else }}https://acme-v02.api.letsencrypt.org/directory{{ end }}
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          {{- $dns := $tls.dns01 }}
          {{- if eq $dns.provider "cloudflare" }}
          cloudflare:
            apiTokenSecretRef:
              name: {{ $tls.cloudflareTokenSecret }}
              key: token
          {{- else if eq $dns.provider "rfc2136" }}
          {{- $r := $dns.rfc2136 }}
          rfc2136:
            nameserver: {{ required "tls.dns01.rfc2136.nameserver is required (host:port)" $r.nameserver | quote }}
            tsigKeyName: {{ required "tls.dns01.rfc2136.tsigKeyName is required" $r.tsigKeyName | quote }}
            tsigAlgorithm: {{ $r.tsigAlgorithm | default "HMACSHA256" | upper | replace "HMAC-" "HMAC" | quote }}
            tsigSecretSecretRef:
              name: {{ $r.tsigSecretName }}
              key: secret
          {{- else }}
          {{- fail (printf "tls.dns01.provider is cloudflare or rfc2136, not %q" $dns.provider) }}
          {{- end }}
