# Production. Its image tag and the revision these values are read at are in
# release.yaml, which only a promotion pull request changes (merge = deploy).
site:
  host: director.mmadan.in
env:
  LOG_LEVEL: info
# Sized for one machine (an e2-standard-8: 8 vCPUs, 32 GB) that also runs the platform
# and observability: one replica of each service, scaling out a little under load. Raise
# these with the machine.
defaults:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 320Mi }
    limits: { memory: 768Mi }
  keda:
    minReplicas: 1
    maxReplicas: 3
services:
  notifications:
    env:
      # Mail goes through the cluster's mail server (deploy/platform/mail): SMTP_URL,
      # with the submission password, is in secrets/notifications.sops.yaml.
      # The mail server's submission account on its email domain.
      EMAIL_FROM: Director <no-reply@director.mmadan.in>
  # Media (uploads, Director takes, final cuts) is on Cloud Storage, not the data chart's
  # RustFS: no service gets the RustFS `storage` Secret (`storage: none`, so no S3_*,
  # which the services refuse next to STORAGE_PROVIDER=gcs). Application Default
  # Credentials (the VM's service account, through the metadata server) sign for the
  # bucket and read and write it directly.
  web:
    autoscaling: { minReplicas: 1, maxReplicas: 3 }
    storage: none
    env:
      # Browsers upload to and play takes from GCS's signed URLs (the CSP's connect-src
      # and media-src).
      STORAGE_ORIGIN: https://storage.googleapis.com
  api:
    autoscaling: { minReplicas: 1, maxReplicas: 3 }
    allowMetadataServer: true
    storage: none
    env:
      STORAGE_PROVIDER: gcs
      GCS_BUCKET: director-media-1053522546520
      # Addresses Vertex AI models by their full resource name for Director's live call,
      # and names the project BIGQUERY_DATASET's events are written to; not a secret.
      GOOGLE_CLOUD_PROJECT: project-18e15b18-c92e-44bb-9bf
      BIGQUERY_DATASET: director
      # Each judge trying the demo gets a private guest, deleted after a day; the shared
      # demo account (DEMO_PASSWORD, in secrets/api.sops.yaml) stays as the fallback.
      DEMO_GUESTS: "on"
      # At most this many at once: each holds an AI allowance and live calls for a day,
      # and the project runs on a fixed budget of credits.
      DEMO_GUEST_LIMIT: "50"
  worker:
    # Checks and moves uploaded files: it must agree with the api on where they live.
    allowMetadataServer: true
    storage: none
    env:
      STORAGE_PROVIDER: gcs
      GCS_BUCKET: director-media-1053522546520
  ai:
    # Application Default Credentials (the VM's service account) for BigQuery's events,
    # Cloud Storage (a short's original audio) and the Cloud Run indexer's ID tokens;
    # Vertex AI calls here still use the express-mode API key.
    allowMetadataServer: true
    env:
      # The production express key addresses every Vertex AI model by its full resource
      # name, which needs the project; not a secret.
      GOOGLE_CLOUD_PROJECT: project-18e15b18-c92e-44bb-9bf
      BIGQUERY_DATASET: director
      # The api's GCS_BUCKET: the audio captured while indexing is played from there.
      MEDIA_BUCKET: director-media-1053522546520
      # Recorded attempts are cut into takes on the Cloud Run clipper, called with the
      # VM's ID token (docs/deploy.md, "The Cloud Run clipper"): production refuses to cut
      # a member's footage in this pod, which holds the secrets and the database.
      CLIPPER_URL: https://director-clipper-1053522546520.us-central1.run.app
  ai-worker:
    allowMetadataServer: true
    env:
      GOOGLE_CLOUD_PROJECT: project-18e15b18-c92e-44bb-9bf
      # Take reviews and indexing run here: both go to the same events table as the api's.
      BIGQUERY_DATASET: director
      MEDIA_BUCKET: director-media-1053522546520
      # The same settings as the ai pod's, which production checks in both.
      CLIPPER_URL: https://director-clipper-1053522546520.us-central1.run.app
      # Plans are indexed by the Cloud Run indexer, called with the VM's ID token
      # (docs/deploy.md, "The Cloud Run indexer"); without INDEXER_URL the worker
      # indexes them itself.
      INDEXER_URL: https://director-indexer-1053522546520.us-central1.run.app
  clamav:
    enabled: true
