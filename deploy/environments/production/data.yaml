# Production: two Postgres instances, continuous backups kept 30 days.
postgres:
  instances: 2
  storage: { size: 50Gi }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }
  backups:
    enabled: true
    retention: 30d
  # Every Sunday at 04:30 UTC (the quiet hours, after the 03:00 base backup), the latest
  # backup restored from the offsite copy into a scratch cluster and checked against the
  # live database (deploy/README.md, "Backups and restore"). While it runs, the scratch
  # cluster claims as much disk as storage.size above, on a node Postgres can run on: keep
  # that free, or turn this off until there is.
  drill:
    enabled: true
storage:
  uploads:
    # Your production hosts: one of the gateway's (<domain> or *.<domain>).
    host: files.example.com
    corsOrigins: [https://app.example.com]
    storage: { size: 100Gi }
  backups:
    storage: { size: 200Gi }
# The copy outside the cluster: required in production. Your S3-compatible storage on
# another machine; its keys go in secrets/offsite-storage.sops.yaml.
offsite:
  required: true
  endpoint: https://s3.backups.example.net
  bucket: boilerplate-offsite
  prefix: production
