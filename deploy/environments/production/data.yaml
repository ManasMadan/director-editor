# Production on one machine: one Postgres instance (a second on the same disk adds
# nothing), continuous backups kept 14 days and copied offsite every hour.
postgres:
  instances: 1
  storage: { size: 15Gi }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }
  backups:
    enabled: true
    retention: 14d
  # The weekly restore drill (deploy/README.md, "Backups and restore") runs a second
  # Postgres as large as this one, which one 16 GB machine can't spare. Turn it on with
  # a bigger machine or a second node.
  drill:
    enabled: false
storage:
  uploads:
    host: director-files.mmadan.in
    corsOrigins: [https://director.mmadan.in]
    storage: { size: 25Gi }
  backups:
    storage: { size: 25Gi }
# The copy outside the cluster: required in production. A GCS bucket through its S3 API
# (an HMAC key); the keys are in secrets/offsite-storage.sops.yaml.
offsite:
  required: true
  endpoint: https://storage.googleapis.com
  region: auto
  bucket: director-editor-offsite-1053522546520
  prefix: production
