# Staging: production's shape at a smaller size. CI sets image.tag on every merge to
# master (a commit to this file).
image:
  tag: ""
site:
  # Your staging host.
  host: staging.example.com
services:
  notifications:
    env:
      # Mail goes through the cluster's mail server (deploy/platform/mail): SMTP_URL,
      # with the submission password, is in secrets/notifications.sops.yaml.
      # Your sender: the mail server's submission account on its email domain.
      EMAIL_FROM: Director <no-reply@example.com>
  web:
    autoscaling: { minReplicas: 2, maxReplicas: 4 }
  api:
    autoscaling: { minReplicas: 2, maxReplicas: 4 }
  clamav:
    enabled: true
