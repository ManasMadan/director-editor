# A pull request's preview (deploy/argocd/appsets/previews.yaml sets image.tag to the
# PR's commit and site.host to pr-<number>.preview.<domain>). Small, one replica, and
# queue workers idle at zero. Its Secrets are shared by every preview, non-production
# credentials: deploy/environments/preview/secrets/.
defaults:
  replicas: 1
  topologySpread: false
  pdb:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  keda:
    minReplicas: 0
    maxReplicas: 2
services:
  web:
    autoscaling: { enabled: false }
    storage: none
  api:
    autoscaling: { enabled: false }
    # No file uploads (no ClamAV, no uploads bucket: see data.yaml).
    storage: none
  worker:
    storage: none
    env:
      FILE_SCANNER: none
  notifications:
    # Mail stays in the preview: its own Mailpit (the data chart's), over TLS with a
    # certificate from the namespace's own authority, which this trusts. Mailpit takes
    # any login, and nothing leaves.
    caBundle: mailpit-tls
    env:
      SMTP_URL: smtps://no-reply%40preview.invalid:preview@mailpit:1025
      EMAIL_FROM: Director Preview <no-reply@example.com>
