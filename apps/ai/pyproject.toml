[project]
name = "ai"
version = "0.1.0"
description = "Python inference service. Its Pydantic models are the source of truth for the TypeScript client in packages/ai-client."
requires-python = ">=3.14"
dependencies = [
  "anyio>=4.15.1",
  # Upgraded only together with the Node package (the root package.json catalog): both
  # run the same Lua scripts on the same queues. tests/test_bullmq_pair.py compares them.
  "bullmq==3.2.8",
  "fastapi[standard]>=0.141.1",
  "httpx>=0.28.1",
  "langgraph>=1.2.12",
  "mcp>=2.2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.0",
  "opentelemetry-instrumentation-fastapi>=0.66b0",
  "opentelemetry-instrumentation-httpx>=0.66b0",
  "opentelemetry-instrumentation-psycopg>=0.66b0",
  "opentelemetry-instrumentation-redis>=0.66b0",
  "opentelemetry-sdk>=1.45.0",
  "pgvector>=0.5.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.13.5",
  "pydantic-ai-slim[anthropic,openai]>=2.51.0",
  "pydantic-settings>=2.15.0",
  "pyjwt[crypto]>=2.10.1",
  "redis>=7.4.1",
  "sqlalchemy[asyncio]>=2.1.1",
  "starlette>=1.7.0",
  "structlog>=26.1.0",
]

[dependency-groups]
dev = [
  "alembic>=1.17.0",
  "basedpyright>=1.40.1",
  "datamodel-code-generator>=0.83.0",
  "pydantic-evals>=2.51.0",
  "pytest-asyncio>=1.2.0",
  "httpx2>=2.13.1",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
  "pytest-cov>=7",
  "watchfiles>=1.3.0",
  "python-dotenv>=1.2.3",
  "deptry>=0.25.1",
]

[tool.uv]
# This is an application, not a library; don't try to build/install it as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, ruff-specific, and async,
# FastAPI, timezone, pytest, pygrep, blind-except, print, bandit and annotation checks.
# C90, PLR0912 and PLR0915 are Biome's complexity limits in Python terms: McCabe
# complexity at most 15 (Biome's cognitive complexity limit), and at most 12 branches and
# 50 statements in a function, ruff's defaults and its nearest to Biome's 60 lines (it has
# no rule for a function's length).
select = [
  "F", "E", "W", "I", "B", "UP", "SIM", "RUF",
  "ASYNC", "FAST", "DTZ", "PT", "PGH", "BLE", "T20", "S", "ANN",
  "C90", "PLR0912", "PLR0915",
]
# structlog's logger: `log.exception(...)` in a handler counts as reporting the error.
logger-objects = ["app.log.log"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# pytest's assertions are plain `assert` statements; bandit's warning is about asserts that
# guard production code, which vanish under `python -O`.
"tests/**" = ["S101"]

[tool.deptry]
# Unused, missing and transitive-only dependencies (`bun run lint`). tests/ is left out:
# its imports are dev dependencies.
known_first_party = ["app", "evals"]

[tool.deptry.per_rule_ignores]
# The evals are development code, like the tests, so pydantic-evals is a dev dependency.
DEP004 = ["pydantic_evals"]
# SQLAlchemy loads it as the driver of postgresql+psycopg URLs; nothing imports it.
DEP002 = ["psycopg"]

[tool.basedpyright]
# Strict mode: every function signature and model field must be typed. This is what
# keeps the generated OpenAPI schema (and therefore the TypeScript types) precise.
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["app", "tests", "evals"]
reportUnusedCallResult = false
# A job or code added on the TypeScript side regenerates a Literal; every `match` over it
# must then handle the new value.
reportMatchNotExhaustive = true
reportAny = true
reportExplicitAny = true
reportIgnoreCommentWithoutRule = true
reportUnnecessaryTypeIgnoreComment = true
executionEnvironments = [
  { root = "tests", extraPaths = ["."] },
  { root = "app", extraPaths = ["."] },
  { root = "evals", extraPaths = ["."] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# `integration` tests need Postgres and Redis (bun run test:integration); the default
# run (bun run test) is pure.
markers = ["integration: needs Postgres and Redis"]
addopts = "-m 'not integration'"

[tool.coverage.run]
# The service and the evals' own code (their library and runner).
source = ["app", "evals"]
branch = true
# The worker runs as a subprocess in the integration tests; measure it there too.
patch = ["subprocess"]

[tool.coverage.report]
# Every line and every branch, unit and integration tests together. Nothing is excluded:
# a line no test reaches is either tested or deleted.
fail_under = 100
show_missing = true
