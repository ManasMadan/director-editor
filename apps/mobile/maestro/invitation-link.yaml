# An invitation link opened by the OS (director-editor://invitations/<id>) shows the
# invitation, and joins the workspace once accepted. INVITATION_ID comes from an
# invitation sent to the signed-in user's address.
appId: com.directoreditor.app.development
---
- runFlow: sign-up-and-restart.yaml
- openLink: director-editor://invitations/${INVITATION_ID}
- tapOn: "Accept invitation"
- assertVisible: "What needs doing?"
