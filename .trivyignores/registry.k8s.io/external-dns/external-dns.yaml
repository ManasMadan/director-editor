# Reviewed exceptions for registry.k8s.io/external-dns/external-dns (scripts/image-scan.ts): fixable vulnerabilities in
# the image an add-on's pinned chart runs, scanned by its tag's digest, with no
# rebuild of that image upstream that has the fix as of 2026-10-06. Each expires in
# about a month; the scan then fails until the add-on moves to a fixed release
# (Renovate proposes it) or the entry is reviewed again.
vulnerabilities:
  - id: CVE-2026-84445
    statement: >-
      google.golang.org/grpc v1.83.1 (fixed in 1.82.2): no upstream rebuild with the fixed package as of 2026-10-06
    expired_at: 2026-11-05
  - id: CVE-2026-78669
    statement: >-
      golang.org/x/net v0.58.0 (fixed in 0.60.0): no upstream rebuild with the fixed package as of 2026-10-13
    expired_at: 2026-11-12
  - id: CVE-2026-78667
    statement: >-
      stdlib v1.26.6 (fixed in 1.26.9, 1.27.2): no upstream rebuild with the fixed package as of 2026-10-13
    expired_at: 2026-11-12
  - id: CVE-2026-97031
    statement: >-
      stdlib v1.26.6 (fixed in 1.26.9, 1.27.2): no upstream rebuild with the fixed package as of 2026-10-13
    expired_at: 2026-11-12
