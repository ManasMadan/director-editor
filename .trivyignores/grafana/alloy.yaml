# Reviewed exceptions for grafana/alloy (scripts/image-scan.ts): fixable vulnerabilities in
# the image the Alloy add-on's pinned chart runs (v1.20.1, the latest release; v1.21.0 is
# only a release candidate), with no rebuild of it upstream that has the fix as of
# 2026-10-18. Each expires in about a month; the scan then fails until the add-on moves
# to a fixed release (Renovate proposes it) or the entry is reviewed again.
vulnerabilities:
  - id: CVE-2026-84782
    statement: >-
      libssl3t64 and openssl 3.0.13-0ubuntu3.15 (fixed in 3.0.13-0ubuntu3.16): no upstream rebuild with the fixed package as of 2026-10-18
    expired_at: 2026-11-17
  - id: CVE-2026-78669
    statement: >-
      golang.org/x/net v0.58.0 (fixed in 0.60.0) and stdlib v1.26.7 (fixed in 1.26.9, 1.27.2): no upstream rebuild with the fixed package as of 2026-10-18
    expired_at: 2026-11-17
  - id: CVE-2026-78667
    statement: >-
      stdlib v1.26.7 (fixed in 1.26.9, 1.27.2): no upstream rebuild with the fixed package as of 2026-10-18
    expired_at: 2026-11-17
  - id: CVE-2026-97031
    statement: >-
      stdlib v1.26.7 (fixed in 1.26.9, 1.27.2): no upstream rebuild with the fixed package as of 2026-10-18
    expired_at: 2026-11-17
