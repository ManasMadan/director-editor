# and npm are brought up to date when it builds; what's left is in OpenTofu's binary
# (1.11.10, the newest 1.11 release), which links these Go modules: no 1.11 release
# with them fixed as of 2026-10-06. Each expires in about a month; the scan then fails
# until OpenTofu moves to a fixed release or the entry is reviewed again.
